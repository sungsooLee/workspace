default:
  tags:
    - docker

stages:
  - build

# pnpm 관련 캐시 설정
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .pnpm-store
    - node_modules/
    - apps/*/node_modules
    - libs/*/node_modules

build:
  stage: build
  image: node:18
  before_script:
    #
    - npm config set strict-ssl false
    #pnpm 설치
    - npm install -g pnpm
    - npm install -g nx
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install --yes
    - npx nx build fo
    - npx nx build bo
  artifacts:
    paths:
      - dist/apps/fo
      - dist/apps/bo
  only:
    - main
