default:
  tags:
    - docker

stages:
  - build
  - deploy

# pnpm 관련 캐시 설정
cache:
  key: ${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}
  paths:
    - .pnpm-store
    - node_modules/
    - apps/*/node_modules
    - libs/*/node_modules

build:
  stage: build
  image: node:18
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH =~ /^build-.*/'
      variables:
        AWS_ACCESS_KEY_ID: '${AWS_ACCESS_KEY_ID_DEV}'
        AWS_SECRET_ACCESS_KEY: '${AWS_SECRET_ACCESS_KEY_DEV}'
        CONFIG: 'dev'
    - when: never
  before_script:
    # 넥서스 레지스트리 설정
    - npm config set registry http://nexus.hmc.co.kr/repository/npm-group/
    - npm config set strict-ssl true
    #pnpm 설치
    - npm install -g pnpm
    - npm install -g nx
    - pnpm config set store-dir .pnpm-store
    - pnpm config set registry http://nexus.hmc.co.kr/repository/npm-group/
    - pnpm config set strict-peer-dependencies false
    - pnpm config set auto-install-peers true
  script:
    - pnpm install --no-frozen-lockfile
    - npx nx build fo --c=${CONFIG}
    - npx nx build bo --c=${CONFIG}
    #퍼블리싱 가이드 프로젝트
    # - npx nx build pb-fo
    # - npx nx build pb-bo
  artifacts:
    paths:
      - dist/apps/fo
      - dist/apps/bo
      # - dist/apps/pb-fo
      # - dist/apps/pb-bo
deploy:
  stage: deploy
  image:
    name: amazon/aws-cli:2.15.0
    entrypoint: ['']
  dependencies: # build 단계의 artifacts 를 사용.
    - build
  script:
    - aws --version
    - aws configure list
    - aws s3 sync dist/apps/fo s3://${S3_BUCKET}/fo --delete
    - aws s3 sync dist/apps/bo s3://${S3_BUCKET}/bo --delete
    # - aws s3 sync dist/apps/pb-fo s3://${S3_BUCKET}/pb-fo --delete
    # - aws s3 sync dist/apps/pb-bo s3://${S3_BUCKET}/pb-bo --delete

    - echo "배포 완료!"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH =~ /^build-.*/'
      variables:
        AWS_ACCESS_KEY_ID: '${AWS_ACCESS_KEY_ID_DEV}'
        AWS_SECRET_ACCESS_KEY: '${AWS_SECRET_ACCESS_KEY_DEV}'
        S3_BUCKET: '${S3_BUCKET_DEV}'
    - when: never
