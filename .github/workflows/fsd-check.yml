name: FSD 아키텍처 검사

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/**/*.ts'
      - 'apps/**/*.tsx'
      - 'apps/**/*.js'
      - 'apps/**/*.jsx'
      - 'libs/**/*.ts'
      - 'libs/**/*.tsx'
      - 'libs/**/*.js'
      - 'libs/**/*.jsx'

jobs:
  fsd-check:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 환경 설정
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: FSD 아키텍처 검사 실행
        id: fsd-check
        run: |
          echo "## 🏗️ FSD 아키텍처 검사 결과" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # FSD 검사 실행 및 결과 저장
          if npm run fsd:check:ci > fsd-results.txt 2>&1; then
            echo "✅ FSD 아키텍처 위반 사항이 발견되지 않았습니다!" >> $GITHUB_STEP_SUMMARY
            echo "fsd_status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ FSD 아키텍처 위반 사항이 발견되었습니다!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 위반 사항 상세:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat fsd-results.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📚 FSD 아키텍처 가이드는 [CONTRIBUTING.md](./CONTRIBUTING.md)를 참고해주세요." >> $GITHUB_STEP_SUMMARY
            echo "fsd_status=failure" >> $GITHUB_OUTPUT
          fi

      - name: PR에 FSD 검사 결과 댓글 작성
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const fsdStatus = '${{ steps.fsd-check.outputs.fsd_status }}';

            let comment = '';

            if (fsdStatus === 'success') {
              comment = `## 🏗️ FSD 아키텍처 검사 ✅
              
              FSD 아키텍처 위반 사항이 발견되지 않았습니다! 깨끗한 아키텍처를 유지해주셔서 감사합니다.
              
              ---
              _이 검사는 Feature-Sliced Design 원칙 준수를 보장합니다._`;
            } else {
              const results = fs.readFileSync('fsd-results.txt', 'utf8');
              comment = `## 🏗️ FSD 아키텍처 검사 ❌
              
              FSD 아키텍처 위반 사항이 발견되었습니다:
              
              \`\`\`
              ${results}
              \`\`\`
              
              ### 📚 가이드라인
              - FSD 아키텍처 규칙은 [CONTRIBUTING.md](./CONTRIBUTING.md)를 참고해주세요
              - 올바른 계층 의존성을 확인하세요: \`app → pages → widgets → features → entities → shared\`
              - 모듈 import 시 Public API(index.ts)를 사용하세요
              - features/entities 내에서 같은 레벨 간 import를 피하세요
              
              ---
              _이 검사는 Feature-Sliced Design 원칙 준수를 보장합니다._`;
            }

            // 기존 댓글 찾기
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(comment => 
              comment.body.includes('🏗️ FSD 아키텍처 검사')
            );

            if (existingComment) {
              // 기존 댓글 업데이트
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              // 새 댓글 생성
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

      - name: 위반 사항 발견 시 작업 실패
        if: steps.fsd-check.outputs.fsd_status == 'failure'
        run: |
          echo "::error::FSD 아키텍처 위반 사항이 발견되었습니다. 머지 전에 수정해주세요."
          exit 1
