<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>프론트엔드 개발 가이드</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="FSD 아키텍처 기반 React + TypeScript 개발 가이드" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
    <style>
      :root {
        --theme-color: #42b883;
      }
      .sidebar-nav li strong {
        font-size: 1.1em;
        margin: 0;
      }
      .markdown-section pre {
        background-color: #f8f8f8;
      }
      .markdown-section code {
        background-color: #f3f4f5;
        padding: 2px 4px;
        border-radius: 3px;
      }
      .markdown-section h1 {
        color: #2c3e50;
        border-bottom: 2px solid #42b883;
        padding-bottom: 8px;
      }
      .sidebar-nav > ul > li > a {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="app">📚 문서를 로딩 중입니다...</div>
    <script>
      window.$docsify = {
        name: '프론트엔드 개발 가이드',
        repo: '',
        homepage: '01-README.md',
        loadSidebar: true,
        subMaxLevel: 3,
        auto2top: true,
        search: {
          maxAge: 86400000,
          paths: 'auto',
          placeholder: '검색어를 입력하세요',
          noData: '검색 결과가 없습니다',
          depth: 6,
        },
        copyCode: {
          buttonText: '복사',
          errorText: '오류',
          successText: '복사완료!',
        },
        pagination: {
          previousText: '이전',
          nextText: '다음',
        },
      };
    </script>
    <!-- Docsify v4 -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <!-- 검색 플러그인 -->
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <!-- 코드 복사 플러그인 -->
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
    <!-- 페이지네이션 -->
    <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
    <!-- 프리즘 구문 강조 -->
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-jsx.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-tsx.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  </body>
</html>
