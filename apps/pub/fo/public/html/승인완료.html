<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>승인완료</title>
  </head>
  <body>
    <!-- 이메일 폼 -->
    <div style="padding: 0; margin: 0 auto; max-width: 680px; width: 100%">
      <div style="border: 1px solid #d6dae1; border-radius: 16px">
        <div
          style="
            margin: 0;
            padding: 17px 20px;
            vertical-align: top;
            border-bottom: 1px solid #edf0f7;
          "
        >
          <h2 style="margin: 0; padding: 0">
            <img
              src="http://internal-hae-dev-hmgnlp-ingress-alb-an2-1797144147.ap-northeast-2.elb.amazonaws.com/public/logo.png"
              alt="Learning way"
              style="height: 20px"
            />
          </h2>
        </div>

        <div style="margin: 0; padding: 40px">
          <div style="margin: 0; padding: 0">
            <h3
              style="
                margin: 0;
                padding: 0;
                font-weight: 600;
                color: #4c515e;
                font-size: 18px;
                text-align: left;
              "
            >
              HRD 담당자 역할 신청 승인 완료
            </h3>
            <p
              style="
                margin: 16px 0 0;
                padding: 0;
                color: #6f798b;
                font-size: 14px;
                line-height: 1.6;
                text-align: left;
              "
            >
              안녕하세요 {고객명}님<br />
              신청하신 HRD 담당자 역할 신청 승인이 완료되었습니다.<br />
              HRD 담당자 역할을 기간 내에 사용할 수 있습니다.<br />
              자세한 내용은 HRD 센터 나의 권한 > 상세에서 승인 내역을 확인할 수 있습니다.<br /><br />
              편리한 서비스 이용을 위해 항상 노력하겠습니다.<br />
              감사합니다.<br /><br />
              {러닝웨이} 드림
            </p>
          </div>

          <div
            style="
              margin: 40px 0 0;
              padding: 40px 0 0;
              text-align: center;
              border-top: 1px solid #edf0f7;
            "
          >
            <button
              style="
                font-weight: 700;
                color: #fff;
                font-size: 14px;
                background-color: #00afd5;
                border-radius: 4px;
                height: 40px;
                line-height: 40px;
                padding: 0 12px;
                margin: 0 auto;
                border: 0;
                text-decoration: none;
              "
            >
              승인내역 확인하기
            </button>
          </div>
        </div>
      </div>

      <div style="margin: 32px 0 0; padding: 0; text-align: center">
        <div style="margin: 0; padding: 0; color: #6f798b; font-size: 12px">
          <span style="color: #6f798b"
            >copyright © 2023 Hyundai-Autoever. All rights reserved.</span
          >
          <p style="margin: 10px 0 0; padding: 0; color: #a9afb8; font-size: 12px">
            본 메일은 발신 정용 메일이며 러닝웨이 운영사인 현대오토에버에서 발송한 메일입니다.
          </p>
        </div>
      </div>
    </div>
    <!--// 이메일 폼 -->
  </body>
</html>
